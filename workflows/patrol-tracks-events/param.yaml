      'acoustic_detection',
      'environmental_all_clear',
      'drone_testing',
      'mep_elephant_sighting',
      'mep_school_programme',
      'environmental_value',
      'mep_visitors',
      'mep_translocation',
      'mep_elephant_test_sighting',
      'mep_illegal_logging',
      'firms_rep',
      'mep_collaring',
