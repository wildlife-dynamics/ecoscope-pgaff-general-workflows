workflow_details:
  name: "Patrol Tracks Events Workflow"
  description: "Process and visualize patrol observations and events."

er_client_name:
  data_source:
    name: "mep" # Ecoscope

er_patrol_types:
  patrol_types: ["MEP_routine_vehicle_patrol_bravo_team"]

er_patrol_status:
  status: ["done"]

