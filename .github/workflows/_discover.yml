name: Discover Workflows

on:
  workflow_call:
    outputs:
      workflows:
        description: "List of workflow directories"
        value: ${{ jobs.discover-workflows.outputs.workflows }}
      pairs:
        description: "List of workflow-testcase pairs"
        value: ${{ jobs.discover-workflow-test-pairs.outputs.pairs }}

jobs:
  discover-workflows:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.find-workflows.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find workflow folders
        id: find-workflows
        run: |
          # Get changed files compared to the base branch
          git fetch origin ${{ github.base_ref }}
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$changed_files"
          echo ""

          # Extract unique workflow directories from changed files
          # Only include files under workflows/ directory
          changed_workflows=$(echo "$changed_files" | grep '^workflows/' | cut -d'/' -f2 | sort -u)

          # Convert to JSON array
          if [ -z "$changed_workflows" ]; then
            workflows="[]"
            echo "No workflow changes detected"
          else
            workflows=$(echo "$changed_workflows" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Found changed workflows: $workflows"
          fi

          echo "workflows=$workflows" >> $GITHUB_OUTPUT
